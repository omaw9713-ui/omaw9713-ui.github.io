<!DOCTYPE html> 
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ဝင့်ဝါဦး</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #ff4757;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .name {
            font-size: 1.5rem;
            color: #2f3542;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .wish {
            font-size: 1.1rem;
            color: #57606f;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎂 Happy Birthday!</h1>
        <div class="name">ဝင့်ဝါဦး</div>
        <p class="wish">အရူးမရေ... မွေးနေ့မှစပြီး လင်လိုချင်ရင်လင်ရ၊ ကလေးလိုချင်ကလေးရ၊ စိတ်ချမ်းသာကိုယ်ကျန်းမာပါစေ။ 💖</p>
    </div>

</body>
</html>
